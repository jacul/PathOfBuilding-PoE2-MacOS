name: macOS build
on:
  # main only advances during a release (fast-forward from develop), which the
  # tag-triggered macOS release workflow already builds — so don't build it here.
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
jobs:
  # A release fast-forwards develop and pushes the v*-macos.* tag at the same
  # commit. That commit is already built by the tag-triggered release workflow,
  # so skip the develop-push build for it — otherwise a release runs two
  # identical builds (this one + the release). Normal develop pushes and PRs are
  # never release-tagged, so they build as usual. This tiny gate runs in seconds.
  gate:
    runs-on: ubuntu-latest
    outputs:
      release_tagged: ${{ steps.check.outputs.release_tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags to see if HEAD is a release commit
      - id: check
        run: |
          if git tag --points-at HEAD | grep -qE '^v[0-9].*-macos\.[0-9]+$'; then
            echo "release_tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_tagged=false" >> "$GITHUB_OUTPUT"
          fi

  build_macos:
    needs: gate
    if: needs.gate.outputs.release_tagged != 'true'
    # The runner's macOS does not set the app's minimum: the bundled libraries
    # are built from source for that minimum instead of coming from Homebrew
    # bottles, and the package is checked against it. See docs/macos.md.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      # Build tools only. The host links the SDK's curl and zlib, and Homebrew's
      # SDL3, LuaJIT and zstd must not be what gets bundled.
      - name: Install build tools
        run: brew install cmake ninja pkgconf
      - name: Build SDL3, LuaJIT and zstd for the app's minimum macOS
        # Also exports PKG_CONFIG_PATH, MACOSX_DEPLOYMENT_TARGET and LuaJIT's
        # bin directory to the steps below.
        run: tools/macos/build_deps.sh
      - name: Run macOS script tests
        run: tools/macos/tests/run.sh
      - name: Build app
        run: tools/macos/build_app.sh
      - name: Package app
        run: tools/macos/package_app.sh
      - name: Check minimum macOS
        run: tools/macos/check_min_macos.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PathOfBuilding-PoE2-macos-arm64
          path: |
            dist/macos-arm64/PathOfBuilding-PoE2-macos-arm64.zip
            dist/macos-arm64/PathOfBuilding-PoE2-macos-arm64.zip.sha256
