name: macOS release
# Builds the native macOS app and publishes it to a GitHub Release whenever a
# version tag like `v0.16.0-macos.1` is pushed. Can also be run manually against
# an existing tag via the Actions tab.
on:
  push:
    tags:
      - 'v*-macos.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach release assets to (e.g. v0.16.0-macos.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    # The runner's macOS does not set the app's minimum: the bundled libraries
    # are built from source for that minimum instead of coming from Homebrew
    # bottles, and the package is checked against it before publishing. See
    # docs/macos.md.
    runs-on: macos-26
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          submodules: recursive
      # The library build and the package checks come from this workflow's own
      # commit rather than the tag: a manual run against an older tag builds that
      # tag's tree, which may predate them (tags up to v0.23.1-macos.18 have none
      # of them). On a tag push the two are the same commit.
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          path: .release-tooling
          sparse-checkout: |
            tools/macos
            macos
      - name: Verify tag matches Info.plist version
        run: |
          set -eu
          TAG="${{ steps.tag.outputs.tag }}"
          t="${TAG#v}"
          case "$t" in
            *-macos.*) ;;
            *) echo "Tag '$TAG' is not of the form v<engine>-macos.<build>." >&2; exit 1;;
          esac
          tag_engine="${t%-macos.*}"
          tag_build="${t##*-macos.}"
          case "$tag_build" in ''|*[!0-9]*) echo "Tag '$TAG' has a non-numeric build." >&2; exit 1;; esac
          case "$tag_engine" in ''|*[!0-9.]*) echo "Tag '$TAG' has a bad engine version." >&2; exit 1;; esac
          plist="macos/Info.plist.in"
          short="$(awk '/CFBundleShortVersionString/{getline; gsub(/[^0-9.]/,"",$0); print $0; exit}' "$plist")"
          cfv="$(awk '/<key>CFBundleVersion<\/key>/{getline; gsub(/[^0-9]/,"",$0); print $0; exit}' "$plist")"
          if [ "$tag_engine" != "$short" ] || [ "$tag_build" != "$cfv" ]; then
            echo "Tag $TAG disagrees with Info.plist (engine=$short build=$cfv)." >&2
            echo "Run 'tools/macos/set_version.sh $tag_build' on the release commit and re-tag." >&2
            exit 1
          fi
          echo "Tag $TAG matches Info.plist (engine $short, build $cfv)."
      # Build tools only. The host links the SDK's curl and zlib, and Homebrew's
      # SDL3, LuaJIT and zstd must not be what gets bundled.
      - name: Install build tools
        run: brew install cmake ninja pkgconf
      - name: Build SDL3, LuaJIT and zstd for the app's minimum macOS
        # Also exports PKG_CONFIG_PATH, MACOSX_DEPLOYMENT_TARGET and LuaJIT's
        # bin directory to the steps below. Those are read by pkg-config, CMake
        # and clang themselves, so any tag's build scripts pick them up.
        run: .release-tooling/tools/macos/build_deps.sh
      - name: Run macOS script tests
        run: tools/macos/tests/run.sh
      - name: Build and package
        run: |
          tools/macos/build_app.sh
          tools/macos/package_app.sh
      - name: Check minimum macOS
        run: .release-tooling/tools/macos/check_min_macos.sh "dist/macos-arm64/Path of Building (PoE2).app"
      - name: Check the bundled LuaJIT loads the app's Lua
        run: .release-tooling/tools/macos/check_bundled_lua.sh "dist/macos-arm64/Path of Building (PoE2).app"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          ZIP="dist/macos-arm64/PathOfBuilding-PoE2-macos-arm64.zip"
          SUM="${ZIP}.sha256"
          SHA="$(awk '{print $1}' "$SUM")"

          cat > notes.md <<EOF
          Native macOS (Apple Silicon) build for \`${TAG}\`.

          ## Install
          1. Download \`PathOfBuilding-PoE2-macos-arm64.zip\` below and unzip it.
          2. Move **Path of Building (PoE2).app** to /Applications.
          3. The app is **not notarized**, so on first launch right-click it and choose **Open**, or run:
             \`\`\`bash
             xattr -dr com.apple.quarantine "/Applications/Path of Building (PoE2).app"
             \`\`\`

          ## Verify the download (optional)
          \`\`\`bash
          shasum -a 256 -c PathOfBuilding-PoE2-macos-arm64.zip.sha256
          \`\`\`
          SHA-256: \`${SHA}\`

          See [SECURITY.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/SECURITY.md) for account sign-in and data handling details.
          EOF

          # Create the release if it doesn't exist yet, then (re)upload assets.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" "$ZIP" "$SUM" --clobber
